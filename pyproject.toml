[project]
name = "culprit"
version = "0.1.0"
description = "Finds the step that actually broke the run"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.139.2",
    "fastembed>=0.5.0",
    "litellm<1.90; sys_platform == 'win32'",
    "litellm; sys_platform != 'win32'",
    "numpy>=2.5.1",
    "opentelemetry-proto>=1.29.0",
    "pgvector>=0.3.6",
    "psycopg[binary,pool]>=3.2.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "redis>=5.2.0",
    # Direct, not left to typer's optional extra: render.py imports rich
    # itself, so a typer release that stops pulling it would break the CLI's
    # read surfaces rather than only its help formatting.
    "rich>=13.0.0",
    "rq>=2.0.0",
    "scikit-learn>=1.6.0",
    "typer>=0.27.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
culprit = "culprit.cli:app"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.26.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# culprit's own configuration lives in culprit.toml, not here.
