name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # Runs the suite and compares its counts against README.md's claim.
      # The suite is not run separately first: this step runs it, so a test
      # failure fails the job here rather than costing a second full run.
      - name: Run offline test suite and check README counts
        run: uv run python scripts/check_readme_counts.py
