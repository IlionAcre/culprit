# Alembic config for culprit.
#
# This project has no SQLAlchemy ORM models and does not use
# `alembic revision --autogenerate`. Every revision under migrations/versions
# is hand-written DDL. sqlalchemy.url is intentionally left unset here: the
# connection string comes from CULPRIT_TEST_DSN or CULPRIT_DATABASE_URL at
# runtime (see migrations/env.py), so a real or placeholder DSN never sits
# checked into version control.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
